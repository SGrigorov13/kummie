name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint · typecheck · test · build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows too: every script must work in PowerShell on the owner's machine.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Includes mobile (tsc only — mobile has no build step in CI).
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web, api, admin
        run: pnpm turbo run build --filter=web --filter=api --filter=admin
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  api-database:
    name: API integration tests (PostgreSQL 16, as on Bulinfo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kummie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # The database name must end in "_test": the suite wipes it before running.
      - name: Migrations, seed and catalogue queries against a real database
        run: pnpm --filter api test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kummie_test
